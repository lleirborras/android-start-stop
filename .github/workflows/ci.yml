name: ci

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  # Actions > ci > Run workflow publishes a beta of the chosen branch for the app's beta program.
  workflow_dispatch:

permissions: {}

concurrency:
  # Betas share one group, so two at once cannot pick the same number.
  group: ci-${{ github.event_name == 'workflow_dispatch' && 'beta' || github.ref }}
  cancel-in-progress: false
  queue: max    # keep every pending run; the default keeps one, so quick merges lost their release

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Lint shell scripts
        run: shellcheck build.sh test.sh scripts/next-version.sh

      - name: Unit tests
        run: sh test.sh

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read    # gitleaks lists the pull request's commits
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Audit workflows
        uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
        with:
          # Code scanning upload needs GitHub Advanced Security on a private repo; fail the job instead.
          advanced-security: false

  build:
    needs: [test, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read    # find the merged pull request's branch name
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" "platforms;android-34" > /dev/null

      # A pushed vX.Y.Z tag releases as is. A pull request merged to master releases
      # the next version according to its branch prefix (see scripts/next-version.sh).
      - name: Decide release tag
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=""
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            # A beta of the version this branch would release, numbered after its earlier betas.
            tags=$(gh api "repos/$GITHUB_REPOSITORY/tags" --paginate --jq '.[].name')
            latest=$(printf '%s\n' "$tags" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
            tag=$(printf '%s\n' "$tags" | sh scripts/beta-tag.sh "$GITHUB_REF_NAME" "${latest:-v0.0.0}")
            echo "beta of '$GITHUB_REF_NAME', latest tag '$latest', beta tag '$tag'"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          elif [ "$GITHUB_EVENT_NAME" = push ]; then
            # Only a pull request merged into master counts, and it must be the only one for this commit.
            branches=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
              --jq '.[] | select(.merged_at != null and .base.ref == "master") | .head.ref')
            if [ "$(printf '%s' "$branches" | grep -c .)" -gt 1 ]; then
              echo "::error::more than one merged pull request matches this commit"
              exit 1
            fi
            branch="$branches"
            if [ -n "$branch" ]; then
              # A failed lookup must stop the job; only a successful, empty answer means "no tags yet".
              tags=$(gh api "repos/$GITHUB_REPOSITORY/tags" --paginate --jq '.[].name')
              latest=$(printf '%s\n' "$tags" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
              tag=$(sh scripts/next-version.sh "$branch" "$latest")
              echo "merged branch '$branch', latest tag '$latest', next tag '$tag'"
              # Queued runs are not guaranteed to start in push order, and a re-run sees its own release.
              if [ -n "$tag" ] && [ -n "$latest" ]; then
                status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$latest...$GITHUB_SHA" --jq '.status')
                if [ "$status" = behind ] || [ "$status" = identical ]; then
                  echo "::warning::$latest already contains this commit; not releasing it again"
                  tag=""
                fi
              fi
              if [ -n "$tag" ] && [ -n "$latest" ]; then
                highest=$(printf '%s\n%s\n' "$tag" "$latest" | sort -V | tail -n 1)
                if [ "$tag" = "$latest" ] || [ "$highest" != "$tag" ]; then
                  echo "::error::next tag $tag is not newer than $latest"
                  exit 1
                fi
              fi
            fi
          fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            pattern='^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$'
          else
            pattern='^v[0-9]+\.[0-9]+\.[0-9]+$'
          fi
          if [ -n "$tag" ] && ! echo "$tag" | grep -Eq "$pattern"; then
            echo "::error::release tag $tag does not match $pattern"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # Signed with a debug key made on the runner; the release job signs it again with the release key.
      - name: Build APK
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RUN_NUMBER: ${{ github.run_number }}
          # Public, write-only PostHog project key; diagnostics are left out of the build when unset.
          POSTHOG_KEY: ${{ vars.POSTHOG_KEY }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
        run: |
          # A release's code comes from its tag, so it is ordered like the tags whatever order the runs ran in.
          if [ -n "$RELEASE_TAG" ]; then
            export VERSION_NAME="${RELEASE_TAG#v}"
            VERSION_CODE=$(sh scripts/version-code.sh "$RELEASE_TAG")
          else
            export VERSION_NAME="dev-${GITHUB_SHA::7}"
            VERSION_CODE="$RUN_NUMBER"
          fi
          export VERSION_CODE
          sh build.sh

      - name: Check APK contents
        run: |
          bt="$ANDROID_HOME/build-tools/34.0.0"
          "$bt/aapt2" dump badging build/nostartstop.apk | grep -q "launchable-activity: name='com.furgo.nostartstop.MainActivity'"
          "$bt/aapt2" dump badging build/nostartstop.apk | grep -q "^application: .*icon='res/mipmap-"
          "$bt/dexdump" build/nostartstop.apk | grep 'Class descriptor' > classes.txt
          grep -q "Lcom/furgo/nostartstop/BootService;" classes.txt
          grep -q "Lcom/furgo/nostartstop/BootReceiver;" classes.txt
          # The TWUtil stub is compile-only; packaging it would shadow the head unit's real class.
          if grep -q "Landroid/tw/john/TWUtil;" classes.txt; then
            echo "::error::TWUtil stub was packaged into the APK"
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nostartstop-apk
          path: build/nostartstop.apk

  # Runs no code from the repository, but its steps come from the branch's own ci.yml: the release environment's
  # branch policy and reviewers are what keep the signing key from other branches.
  release:
    needs: build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.build.outputs.tag != ''
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write        # create the release and its tag
      pull-requests: read    # find the merged pull request for the notes
    env:
      RELEASE_TAG: ${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" > /dev/null

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nostartstop-apk
          path: build

      - name: Sign APK
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_B64" ]; then
            echo "::error::RELEASE_KEYSTORE_B64 secret is missing; refusing to release a debug-signed APK"
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          bt="$ANDROID_HOME/build-tools/34.0.0"
          "$bt/apksigner" sign --ks "$RUNNER_TEMP/release.p12" --ks-key-alias release \
            --ks-pass env:KS_PASS --key-pass env:KS_PASS build/nostartstop.apk
          rm "$RUNNER_TEMP/release.p12"
          "$bt/apksigner" verify build/nostartstop.apk

      # The approval can wait for hours: a stable release of the same version may have come out meanwhile, and
      # then no one would be offered this beta.
      - name: Check the beta is still ahead
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          base="${RELEASE_TAG%-beta.*}"
          latest=$(gh api "repos/$GITHUB_REPOSITORY/tags" --paginate --jq '.[].name' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "$base" "$latest" | sort -V | tail -n 1)" = "$latest" ]; then
            echo "::error::$latest is already out, so $RELEASE_TAG would never be offered; run the workflow again"
            exit 1
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}    # no checkout here for gh to read it from
        run: |
          apk="nostartstop-$RELEASE_TAG.apk"
          cp build/nostartstop.apk "$apk"
          # Release notes are the merged pull request's title and description.
          # A hand-pushed tag has no pull request and gets GitHub's generated notes.
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq '.[] | select(.merged_at != null and .base.ref == "master") | .number' | head -n 1)
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            # A pre-release: left out of releases/latest, so only the beta program is offered it.
            gh release create "$RELEASE_TAG" "$apk" --target "$GITHUB_SHA" --title "$RELEASE_TAG" --prerelease \
              --notes "Beta build of \`$GITHUB_REF_NAME\` at $GITHUB_SHA."
          elif [ "$GITHUB_REF_TYPE" != tag ] && [ -n "$pr" ]; then
            gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq '"## " + .title + "\n\n" + (.body // "")' > "$RUNNER_TEMP/notes.md"
            gh release create "$RELEASE_TAG" "$apk" --target "$GITHUB_SHA" --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$RELEASE_TAG" "$apk" --target "$GITHUB_SHA" --title "$RELEASE_TAG" --generate-notes
          fi
